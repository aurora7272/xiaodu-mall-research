<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小度商城研究站</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#F4F6FB;--card:#FFFFFF;--fg:#141A2E;--muted:#5D6580;--line:#DCE1EE;--mark:#2F5BFF;--on:#FFFFFF;--err:#C62B2B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1220;--card:#171C2E;--fg:#EEF1F8;--muted:#9AA3BD;--line:#2A3150;--mark:#5E7FFF;--on:#FFFFFF;--err:#FF7A7A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
 font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","PingFang SC","Microsoft JhengHei",sans-serif;
 padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;display:grid;gap:14px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--mark);display:grid;place-items:center}
h1{font-size:20px;margin:4px 0 0;text-wrap:balance}
p{margin:0;color:var(--muted);font-size:13px}
input{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
input:focus{outline:2px solid var(--mark);outline-offset:1px}
button{font:inherit;font-weight:600;padding:11px;border:0;border-radius:10px;background:var(--mark);color:var(--on);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.4em;font-size:13px;color:var(--err)}
.msg.ok{color:var(--muted)}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <h1>小度商城研究站</h1>
  <p>內部資料，請輸入訪問密碼。</p>
  <input id="pw" type="password" placeholder="訪問密碼" aria-label="訪問密碼" autofocus>
  <button id="go" type="submit">進入</button>
  <div class="msg" id="msg" role="status"></div>
</form>
<script>
(()=>{ // 包在函數裡：document.write 後全局變量會保留，不能和網站腳本的 $ 等重名
const ITER=600000, enc=new TextEncoder(), $=s=>document.getElementById(s);
let blobP=fetch('site.bin',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()});
async function open_(raw){
  const b=new Uint8Array(await blobP), salt=b.slice(0,16), iv=b.slice(16,28), ct=b.slice(28);
  const key=raw?await crypto.subtle.importKey('raw',raw,'AES-GCM',true,['decrypt'])
    :await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},
      await crypto.subtle.importKey('raw',enc.encode($('pw').value),'PBKDF2',false,['deriveKey']),
      {name:'AES-GCM',length:256},true,['decrypt']);
  const z=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  const html=await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream('deflate'))).text();
  try{sessionStorage.setItem('xd-k',btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key)))))}catch(e){}
  document.open();document.write(html);document.close();
}
$('f').addEventListener('submit',async e=>{
  e.preventDefault(); if(!$('pw').value)return;
  $('go').disabled=true; $('msg').className='msg ok'; $('msg').textContent='正在解密…';
  try{await open_()}catch(err){$('go').disabled=false;$('msg').className='msg';$('msg').textContent='密碼不正確，請重試。';$('pw').select()}
});
try{const k=sessionStorage.getItem('xd-k')||sessionStorage.getItem('xd-k'); if(k){$('msg').className='msg ok';$('msg').textContent='正在打開…';
  open_(Uint8Array.from(atob(k),c=>c.charCodeAt(0))).catch(()=>{sessionStorage.removeItem('xd-k');$('msg').textContent=''})}}catch(e){}
})();
</script>
</body>
</html>
